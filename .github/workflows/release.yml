name: Release

on:
  push:
    branches: [ master ]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version from Program.cs
        id: version
        run: |
          VERSION=$(grep -oP '(?<=AppVersion = ")[^"]+' Charon.Dns/Program.cs)
          if [ -z "$VERSION" ]; then
            echo "Could not extract AppVersion from Charon.Dns/Program.cs" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check for existing release
        id: existing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${{ steps.version.outputs.tag }}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup .NET
        if: steps.existing.outputs.exists == 'false'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Run tests
        if: steps.existing.outputs.exists == 'false'
        run: dotnet test DNS.sln -c Release --filter "FullyQualifiedName!~EndToEnd"

      - name: Publish linux-x64
        if: steps.existing.outputs.exists == 'false'
        run: >
          dotnet publish Charon.Dns/Charon.Dns.csproj
          -c Release
          -r linux-x64
          --self-contained true
          -p:PublishSingleFile=true
          -o ./publish-output

      - name: Package release archive
        if: steps.existing.outputs.exists == 'false'
        id: package
        run: |
          ARCHIVE="Charon.Dns.Linux.${{ steps.version.outputs.tag }}.zip"
          chmod +x publish-output/Charon.Dns
          mkdir -p dist
          cp publish-output/Charon.Dns dist/
          cp publish-output/settings.json dist/
          (cd dist && zip -X "../$ARCHIVE" Charon.Dns settings.json)
          echo "archive=$ARCHIVE" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        if: steps.existing.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "Charon.Dns ${{ steps.version.outputs.tag }}"
          generate_release_notes: true
          files: ${{ steps.package.outputs.archive }}
